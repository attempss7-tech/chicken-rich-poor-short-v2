name: render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            dir: shardA
            start: 0
            end: 911
          - shard: 1
            dir: shardB
            start: 912
            end: 1823
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm install --no-save playwright@1.49.1
      # --with-deps runs apt against Ubuntu archives; runner DNS to those
      # archives can fail transiently (both v2 shards died here 2026-11-11).
      # Retry it, then fall back to the browser binary only.
      - run: |
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install attempt $i failed, retrying in 60s"
            sleep 60
          done
          echo "with-deps failed 3x; falling back to browser binary only"
          npx playwright install chromium
      - name: Set CHROME_PATH to installed Chromium
        run: |
          ls ~/.cache/ms-playwright/
          HS="$HOME/.cache/ms-playwright/chromium_headless_shell-1148/chrome-linux/headless_shell"
          if [ -x "$HS" ]; then
            CHROME_PATH="$HS"
          else
            CHROME_PATH="$(ls -d $HOME/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1)"
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> $GITHUB_ENV
          echo "CHROME_PATH=$CHROME_PATH"
          ls -la "$CHROME_PATH"
      - name: Ensure ffmpeg (static build, never apt)
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          curl -sL -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          sudo ln -sf /tmp/ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
      - name: Render shard
        run: node scripts/render_range.mjs out/chicken2/${{ matrix.dir }} ${{ matrix.start }} ${{ matrix.end }} 1.3333
        env:
          GL: swiftshader
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seg-${{ matrix.shard }}
          path: out/chicken2/${{ matrix.dir }}
